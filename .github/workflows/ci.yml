name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux-build-and-test:
    name: linux-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      id-token: write

    # Loads mise.dev.toml on top of mise.toml so the format and lint tools are
    # resolved by `mise install` and cached by mise-action, instead of being
    # fetched inside every task run.
    env:
      MISE_ENV: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Linux runner architecture
        run: |
          case "${{ matrix.architecture }}:$(uname -m)" in
            x86_64:x86_64|arm64:aarch64) ;;
            *)
              echo "ERROR: expected ${{ matrix.architecture }}, got $(uname -m)" >&2
              exit 1
              ;;
          esac

      # libudev backs hidapi's hidraw enumeration, while liblzma builds the
      # compressed self-describing Vial fixture. Qt Quick draws the Linux model,
      # Qt D-Bus receives it, and LayerShellQt supplies the overlay role.
      - name: Install Rust system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev liblzma-dev cmake dbus-x11 fonts-noto-core imagemagick libglib2.0-bin "linux-modules-extra-$(uname -r)" qt6-base-dev qt6-declarative-dev qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window

      - name: Install mise
        uses: jdx/mise-action@v4

      # Must follow mise, which is what puts rustc on PATH for the cache key.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Lint
        run: mise run lint

      - name: Run Format
        run: mise run format

      - name: Check third-party license notices
        run: make check-licenses

      - name: Run Tests
        if: matrix.architecture != 'x86_64'
        run: make test

      # Executes both test suites and prints line-coverage summaries. Linux
      # x86_64 supplies the baseline; the other architecture keeps its normal
      # test path without uploading a duplicate report for the same commit.
      - name: Run Tests with Coverage
        if: matrix.architecture == 'x86_64'
        run: make coverage

      - name: Run Rust Tests
        if: matrix.architecture != 'x86_64'
        run: make test-rust

      - name: Upload Coverage
        if: matrix.architecture == 'x86_64'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage-python.xml,coverage-rust.lcov
          flags: linux
          name: linux-x86_64
          use_oidc: true

      - name: Enable the virtual Raw HID test device
        run: |
          sudo modprobe uhid
          sudo chmod 0666 /dev/uhid
          sudo install -m 0644 overlay/platforms/linux/tests/99-keymap-overlay-e2e.rules /etc/udev/rules.d/99-keymap-overlay-e2e.rules
          sudo udevadm control --reload

      # The three systems build different windows out of the same crate, so
      # each one builds the binary it ships.
      # Covers installer rollback, kernel UHID input through the daemon's D-Bus
      # API, and D-Bus output through the Qt renderer and golden image.
      - name: Run Linux release acceptance
        run: make test-release-acceptance-linux

      - name: Check for unformatted files
        run: git diff --exit-code

  # The macOS half of the overlay: hidapi talks to IOKit, the window comes from
  # AppKit, and the binary is installed as a launchd agent. None of that is
  # compiled by the Linux job, which builds the Qt backend instead.
  mac-arm64:
    name: mac-arm64
    runs-on: macos-latest

    permissions:
      contents: read
      id-token: write

    # coverage-rust activates mise.dev.toml, so install and cache that profile
    # before the tests instead of fetching its tools during the coverage step.
    env:
      MISE_ENV: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      # The AppKit implementation is only compiled on macOS. Uploading its
      # Rust report lets Codecov merge it with the Linux baseline.
      - name: Run Rust Tests with Coverage
        run: make coverage-rust

      # Covers installer rollback and simulated runtime events through the
      # main-queue wake-up, model composition, and native AppKit view state.
      - name: Run macOS release acceptance
        run: make test-release-acceptance-macos

      - name: Upload macOS Coverage
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage-rust.lcov
          flags: macos
          name: mac-arm64
          use_oidc: true

  # The Windows half: hidapi's own Windows backend behind a narrow Rust DLL,
  # a WPF-owned window, and a per-user Run key instead of a login agent. Every
  # Make step runs under Git Bash because platform dispatch uses `uname -s`.
  #
  # What this job cannot prove is the part that matters most — that showing the
  # overlay never takes focus. No CI runner has a session to test that in, the
  # same way the layer-shell and launchd paths have always needed a real
  # machine.
  windows-build-and-test:
    name: windows-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: windows-latest
            mise_environment: dev
          - architecture: arm64
            runner: windows-11-vs2026-arm
            mise_environment: ''
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      id-token: write

    # Only x86_64 collects Rust coverage. Keep ARM64 on the base tool profile,
    # while caching the development tools x86_64 would otherwise fetch later.
    env:
      MISE_ENV: ${{ matrix.mise_environment }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      - name: Cache Pester
        id: cache-pester
        uses: actions/cache@v6
        with:
          path: ~/Documents/WindowsPowerShell/Modules/Pester
          key: pester-5.7.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Pester
        if: steps.cache-pester.outputs.cache-hit != 'true'
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Rust Tests with Coverage
        if: matrix.architecture == 'x86_64'
        run: make coverage-rust

      - name: Run Rust Tests
        if: matrix.architecture != 'x86_64'
        run: make test-rust

      # Publishes the self-contained single-file WPF executable, then exercises
      # simulated runtime events through the dispatcher, model composition,
      # and native WPF presentation state.
      - name: Run Windows release acceptance
        run: make test-release-acceptance-windows

      - name: Upload Windows Coverage
        if: matrix.architecture == 'x86_64'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage-rust.lcov
          flags: windows
          name: windows-x86_64
          use_oidc: true

      # Keep the experimental pure-Rust WinUI frontend compiling without
      # changing the installed or released WPF implementation.
      - name: Check the WinUI prototype
        run: cargo check -p keymap-overlay-winui

  # Audits Cargo.lock against the RustSec advisory database. Unlike the other
  # jobs this one can start failing without anything here changing, because the
  # database grows. It builds nothing, so it needs no Rust cache.
  cargo-audit:
    runs-on: ubuntu-latest

    env:
      MISE_ENV: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Audit Rust dependencies
        run: make audit
