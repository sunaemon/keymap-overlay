name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux-lint-and-test:
    runs-on: ubuntu-latest

    # Loads mise.dev.toml on top of mise.toml so the format and lint tools are
    # resolved by `mise install` and cached by mise-action, instead of being
    # fetched inside every task run.
    env:
      MISE_ENV: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # libudev backs hidapi's hidraw enumeration. Qt Quick draws the Linux
      # model, Qt D-Bus receives it, and LayerShellQt supplies the overlay role.
      - name: Install Rust system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev cmake dbus-x11 fonts-noto-core imagemagick libglib2.0-bin qt6-base-dev qt6-declarative-dev

      - name: Install mise
        uses: jdx/mise-action@v4

      # Must follow mise, which is what puts rustc on PATH for the cache key.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Lint
        run: mise run lint

      - name: Run Format
        run: mise run format

      - name: Check third-party license notices
        run: make check-licenses

      - name: Run Tests
        run: make test

      - name: Test release installer
        run: make test-installer-sh

      - name: Run Rust Tests
        run: make test-rust

      # The three systems build different windows out of the same crate, so
      # each one builds the binary it ships.
      # Runs the release daemon and Qt renderer on an isolated session bus,
      # driving real show/hide transitions through the simulator seam.
      - name: Build and test the Linux overlay end to end
        run: make test-e2e-linux

      - name: Check for unformatted files
        run: git diff --exit-code

  # The macOS half of the overlay: hidapi talks to IOKit, the window comes from
  # AppKit, and the binary is installed as a launchd agent. None of that is
  # compiled by the Linux job, which builds the Qt backend instead.
  macos-build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      - name: Test release installer
        run: make test-installer-sh

      - name: Run Rust Tests
        run: make test-rust

      # `make install-overlay` ships this binary, so a release-only build
      # failure would surface at install time rather than here.
      - name: Build the release binary
        run: make build-overlay

  # The Windows half: hidapi's own Windows backend behind a narrow Rust DLL,
  # a WPF-owned window, and a per-user Run key instead of a login agent. Every
  # Make step runs under Git Bash because platform dispatch uses `uname -s`.
  #
  # What this job cannot prove is the part that matters most — that showing the
  # overlay never takes focus. No CI runner has a session to test that in, the
  # same way the layer-shell and launchd paths have always needed a real
  # machine.
  windows-build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: make test

      - name: Cache Pester
        id: cache-pester
        uses: actions/cache@v5
        with:
          path: ~/Documents/WindowsPowerShell/Modules/Pester
          key: pester-5.7.1-${{ runner.os }}

      - name: Install Pester
        if: steps.cache-pester.outputs.cache-hit != 'true'
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Test release installer
        shell: powershell
        run: Invoke-Pester -Path installer/tests/install.Tests.ps1 -CI

      - name: Run Rust Tests
        run: make test-rust

      # Publishes the self-contained single-file WPF executable and embeds the
      # Rust bridge DLL for extraction by the .NET bundle host.
      - name: Build the release overlay
        run: make build-overlay

      # Keep the experimental pure-Rust WinUI frontend compiling without
      # changing the installed or released WPF implementation.
      - name: Check the WinUI prototype
        run: cargo check -p keymap-overlay-winui

  # Audits Cargo.lock against the RustSec advisory database. Unlike the other
  # jobs this one can start failing without anything here changing, because the
  # database grows. It builds nothing, so it needs no Rust cache.
  cargo-audit:
    runs-on: ubuntu-latest

    env:
      MISE_ENV: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Audit Rust dependencies
        run: make audit
