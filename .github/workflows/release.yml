name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Find version bump merged by pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mise exec -- uv run python -m installer.release.prepare_release \
            --tested-sha "$TESTED_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: Linux
            runner: ubuntu-latest
            architecture: x86_64
          - name: linux-arm64
            platform: Linux
            runner: ubuntu-24.04-arm
            architecture: arm64
          - name: mac-arm64
            platform: macOS
            runner: macos-latest
            architecture: arm64
          - name: windows-x86_64
            platform: Windows
            runner: windows-latest
            architecture: x86_64
          - name: windows-arm64
            package_platform: Windows
            runner: windows-11-vs2026-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev cmake qt6-base-dev qt6-declarative-dev

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Verify Linux release architecture
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.architecture }}:$(uname -m)" in
            x86_64:x86_64|arm64:aarch64) ;;
            *)
              echo "ERROR: expected ${{ matrix.architecture }}, got $(uname -m)" >&2
              exit 1
              ;;
          esac

      - name: Verify macOS release architecture
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          test "$(mise exec -- rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin

      - name: Build release overlay
        run: make build-overlay _build_generator

      - name: Package binary and notices
        id: package
        run: |
          mise exec -- uv run python -m installer.release.package_release \
            --platform "${{ matrix.package_platform || matrix.platform }}" \
            --architecture "${{ matrix.architecture }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      id-token: write
      artifact-metadata: write
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Add installers and SHA-256 checksums
        run: |
          cp installer/install.sh installer/install.ps1 release/
          (cd release && sha256sum keymap-overlay-* install.sh install.ps1 > SHA256SUMS)

      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: release/*

      # GH_REPO keeps gh independent of the checkout's remote configuration.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $RELEASE_TAG was created while release assets were building." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --target "$TESTED_SHA" --title "$RELEASE_TAG" --generate-notes
