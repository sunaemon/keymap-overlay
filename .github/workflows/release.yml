name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev libwayland-dev libx11-dev

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Build release binary
        run: mise exec -- cargo build --release -p keymap-overlay

      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          cargo_version="$(mise exec -- cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "keymap-overlay") | .version')"
          python_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          if [ "$RELEASE_TAG" = "$release_version" ] || [ "$cargo_version" != "$release_version" ] || [ "$python_version" != "$release_version" ]; then
            echo "ERROR: tag $RELEASE_TAG, Cargo $cargo_version and Python $python_version must use the same vMAJOR.MINOR.PATCH version." >&2
            exit 1
          fi

      - name: Package binary and notices
        id: package
        run: |
          mkdir -p dist/package
          dist="$PWD/dist"
          arch="$(uname -m)"
          case "$RUNNER_OS" in
            Windows)
              asset="keymap-overlay-windows-${arch}.zip"
              cp target/release/keymap-overlay.exe dist/package/
              cp LICENSE THIRD-PARTY-LICENSES.html dist/package/
              (cd dist/package && 7z a "$dist/$asset" keymap-overlay.exe LICENSE THIRD-PARTY-LICENSES.html)
              ;;
            macOS)
              asset="keymap-overlay-macos-${arch}.tar.gz"
              cp target/release/keymap-overlay LICENSE THIRD-PARTY-LICENSES.html dist/package/
              tar -C dist/package -czf "dist/$asset" keymap-overlay LICENSE THIRD-PARTY-LICENSES.html
              ;;
            Linux)
              asset="keymap-overlay-linux-${arch}.tar.gz"
              cp target/release/keymap-overlay LICENSE THIRD-PARTY-LICENSES.html dist/package/
              tar -C dist/package -czf "dist/$asset" keymap-overlay LICENSE THIRD-PARTY-LICENSES.html
              ;;
          esac
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      id-token: write
      artifact-metadata: write
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Add installers and SHA-256 checksums
        run: |
          cp install.sh install.ps release/
          (cd release && sha256sum keymap-overlay-* install.sh install.ps > SHA256SUMS)

      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: release/*

      # GH_REPO keeps gh independent of the checkout's remote configuration.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$tag_ref" ]; then
            tag_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
            if [ "$tag_type" = tag ]; then
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
            fi
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "ERROR: $RELEASE_TAG points to $tag_sha, not $GITHUB_SHA." >&2
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
