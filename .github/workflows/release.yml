name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev cmake qt6-base-dev qt6-declarative-dev

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Verify macOS release architecture
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          test "$(mise exec -- rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin

      - name: Build release overlay
        run: make build-overlay

      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          cargo_version="$(mise exec -- cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "keymap-overlay") | .version')"
          python_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          if [ "$RELEASE_TAG" = "$release_version" ] || [ "$cargo_version" != "$release_version" ] || [ "$python_version" != "$release_version" ]; then
            echo "ERROR: tag $RELEASE_TAG, Cargo $cargo_version and Python $python_version must use the same vMAJOR.MINOR.PATCH version." >&2
            exit 1
          fi

      - name: Package binary and notices
        id: package
        run: |
          mkdir -p dist/package/example
          cp example/LICENSE dist/package/example/LICENSE
          dist="$PWD/dist"
          arch="$(uname -m)"
          case "$RUNNER_OS" in
            Windows)
              asset="keymap-overlay-windows-${arch}.zip"
              sdk_version="$(dotnet --version)"
              runtime_version="$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" { print $2; exit }')"
              wpf_version="$(dotnet --list-runtimes | awk '$1 == "Microsoft.WindowsDesktop.App" { print $2; exit }')"
              cp target/wpf-publish/keymap-overlay.exe dist/package/
              cp LICENSE.md dist/package/LICENSE
              cp THIRD-PARTY-LICENSES.html dist/package/
              cp "$DOTNET_ROOT/LICENSE.txt" dist/package/DOTNET-LIBRARY-LICENSE.txt
              cp "$DOTNET_ROOT/ThirdPartyNotices.txt" "dist/package/dotnet-runtime-${runtime_version}-THIRD-PARTY-NOTICES.txt"
              cp "$DOTNET_ROOT/sdk/${sdk_version}/Sdks/Microsoft.NET.Sdk.WindowsDesktop/THIRD-PARTY-NOTICES.TXT" \
                "dist/package/dotnet-wpf-${wpf_version}-THIRD-PARTY-NOTICES.txt"
              (cd dist/package && 7z a "$dist/$asset" \
                keymap-overlay.exe LICENSE example/LICENSE THIRD-PARTY-LICENSES.html \
                DOTNET-LIBRARY-LICENSE.txt dotnet-*-THIRD-PARTY-NOTICES.txt)
              ;;
            macOS)
              asset="keymap-overlay-macos-${arch}.tar.gz"
              cp target/release/keymap-overlay THIRD-PARTY-LICENSES.html dist/package/
              cp LICENSE.md dist/package/LICENSE
              tar -C dist/package -czf "dist/$asset" keymap-overlay LICENSE example/LICENSE THIRD-PARTY-LICENSES.html
              ;;
            Linux)
              asset="keymap-overlay-linux-${arch}.tar.gz"
              cp target/release/keymap-overlay target/release/keymap-overlay-qt THIRD-PARTY-LICENSES.html dist/package/
              cp -R linux/gnome-shell dist/package/
              cp LICENSE.md dist/package/LICENSE
              tar -C dist/package -czf "dist/$asset" keymap-overlay keymap-overlay-qt gnome-shell LICENSE example/LICENSE THIRD-PARTY-LICENSES.html
              ;;
          esac
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      id-token: write
      artifact-metadata: write
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Add installers and SHA-256 checksums
        run: |
          cp install.sh install.ps1 release/
          (cd release && sha256sum keymap-overlay-* install.sh install.ps1 > SHA256SUMS)

      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: release/*

      # GH_REPO keeps gh independent of the checkout's remote configuration.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$tag_ref" ]; then
            tag_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
            if [ "$tag_type" = tag ]; then
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
            fi
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "ERROR: $RELEASE_TAG points to $tag_sha, not $GITHUB_SHA." >&2
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
