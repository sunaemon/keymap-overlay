name: Hardware Release Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  hardware-release-gate:
    name: hardware-release-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Verify release hardware evidence
        run: >-
          mise exec -- uv run python -m installer.release.check_hardware_gate
          --event "$GITHUB_EVENT_PATH"
