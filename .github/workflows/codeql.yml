name: CodeQL

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: c-cpp
            build-mode: none
            runner: ubuntu-latest
          - language: csharp
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: rust
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The only Swift source is a standalone macOS hardware-test executable,
      # not an Xcode project or Swift package, so CodeQL cannot autobuild it.
      - name: Build Swift HIL UI
        if: matrix.language == 'swift'
        run: |
          mkdir -p target/codeql
          xcrun swiftc \
            -o target/codeql/keymap-overlay-macos-hil-ui \
            overlay/platforms/macos/tests/hil_accessibility.swift

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
