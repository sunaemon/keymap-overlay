[tools]
# Not in mise.dev.toml with the other tooling: the installed git hooks resolve
# lefthook with a plain `mise exec`, which never loads MISE_ENV=dev. Move it
# there and the hooks fall through to a hardcoded install path, then to an
# `echo` that exits 0, so every check silently stops running.
lefthook = "2.1.10"
rust = { version = "1.97.1", components = "rustfmt,clippy,llvm-tools", profile = "default" }
dotnet = "10.0.400"
python = "3.14.7"
uv = "0.12.3"
"pipx:qmk" = "1.2.0"

# Formatting and linting tools live in mise.dev.toml. The format task and the
# Lefthook lint group expect MISE_ENV=dev, which their Make targets set.

[tasks.format]
description = "Format code (requires MISE_ENV=dev)"
run = """
set -e
uv sync
ruff format .
cargo fmt
git ls-files Makefile "*.mk" | xargs mbake format --config .mbake.toml
# prettier refuses a path given explicitly that is a symbolic link, and the
# per-tool agent guides (CLAUDE.md, .gemini/GEMINI.md) are links to AGENTS.md,
# so drop every symlink from the list; the targets are formatted anyway.
git ls-files "*.md" "*.yml" "*.yaml" "*.json" "*.js" "*.css" | while IFS= read -r f; do [ -L "$f" ] || printf '%s\n' "$f"; done | xargs prettier --write
git ls-files "*.toml" | xargs taplo fmt
git ls-files "*.c" "*.h" "*.cpp" | while IFS= read -r file; do [ ! -f "$file" ] || clang-format -i "$file"; done
"""
