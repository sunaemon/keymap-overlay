[tools]
# Not in mise.dev.toml with the other tooling: the installed git hooks resolve
# lefthook with a plain `mise exec`, which never loads MISE_ENV=dev. Move it
# there and the hooks fall through to a hardcoded install path, then to an
# `echo` that exits 0, so every check silently stops running.
lefthook = "2.1.10"
rust = { version = "1.97.1", components = "rustfmt,clippy,llvm-tools-preview", profile = "default" }
dotnet = "10.0.400"
python = "3.14.7"
uv = "0.12.3"
"pipx:qmk" = "1.2.0"

# Formatting and linting tools live in mise.dev.toml; these tasks expect
# MISE_ENV=dev, which `make format` and `make lint` set.

[tasks.format]
description = "Format code (requires MISE_ENV=dev)"
run = """
set -e
uv sync
ruff format .
cargo fmt
git ls-files Makefile "*.mk" | xargs mbake format --config .mbake.toml
# prettier refuses a path given explicitly that is a symbolic link, and the
# per-tool agent guides (CLAUDE.md, .gemini/GEMINI.md) are links to AGENTS.md,
# so drop every symlink from the list; the targets are formatted anyway.
git ls-files "*.md" "*.yml" "*.yaml" "*.json" "*.js" "*.css" | while IFS= read -r f; do [ -L "$f" ] || printf '%s\n' "$f"; done | xargs prettier --write
git ls-files "*.toml" | xargs taplo fmt
git ls-files "*.c" "*.h" "*.cpp" | while IFS= read -r file; do [ ! -f "$file" ] || clang-format -i "$file"; done
"""

[tasks.lint]
description = "Lint code (requires MISE_ENV=dev)"
run = """
set -e
uv sync
ruff check --fix .
ty check --extra-search-path model/typings .
shellcheck installer/install.sh installer/tests/test_install_sh.sh overlay/platforms/linux/tests/test_dbus_to_renderer_e2e.sh overlay/platforms/linux/tests/test_hid_to_dbus_e2e.sh overlay/platforms/linux/tests/test_hardware_physical_reports.sh overlay/platforms/linux/tests/test_hardware_session.sh overlay/platforms/macos/tests/test_appkit_e2e.sh overlay/platforms/macos/tests/test_hardware_physical_reports.sh overlay/platforms/macos/tests/test_hardware_session.sh overlay/platforms/macos/tests/test_hardware_lifecycle.sh overlay/platforms/macos/tests/test_hardware_login.sh firmware/tools/test_hardware_macos.sh
cargo clippy --workspace --all-targets -- -D warnings
"""
