# Git hooks, installed by `make setup` or `make install-hooks`.
#
# The hooks call the same make targets CI runs, so a commit that passes here
# passes the pipeline. Set LEFTHOOK=0 to skip them for a single command, e.g.
# `LEFTHOOK=0 git commit`.

# The Python fixer must finish before its type checker reads the same files.
# That lane still runs alongside the independent shell and Rust linters.
lint:
  parallel: true
  setup:
    - run: uv sync
  jobs:
    - name: python
      group:
        piped: true
        jobs:
          - name: ruff
            run: ruff check --fix .
          - name: ty
            run: ty check --extra-search-path model/typings .
    - name: shellcheck
      run: shellcheck installer/install.sh installer/tests/test_install_sh.sh overlay/platforms/linux/tests/test_dbus_to_renderer_e2e.sh overlay/platforms/linux/tests/test_hid_to_dbus_e2e.sh overlay/platforms/linux/tests/test_hardware_physical_reports.sh overlay/platforms/linux/tests/test_hardware_session.sh overlay/platforms/macos/tests/test_appkit_e2e.sh overlay/platforms/macos/tests/test_hardware_physical_reports.sh overlay/platforms/macos/tests/test_hardware_session.sh overlay/platforms/macos/tests/test_hardware_lifecycle.sh overlay/platforms/macos/tests/test_hardware_login.sh firmware/tools/test_hardware_macos.sh
    - name: clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

pre-commit:
  # `make format` rewrites files and `make lint` applies ruff's fixes, so both
  # restage what they touched.
  jobs:
    - name: format
      run: make format
      stage_fixed: true
    - name: lint
      run: make lint
      stage_fixed: true
    # The report changes with dependencies, package metadata, workspace
    # versions, cargo-about itself, and its rendering configuration. Keep this
    # check non-mutating so a hook never adds an unstaged generated file.
    - name: license-notices
      run: make check-licenses
      glob:
        - Cargo.lock
        - Cargo.toml
        - '**/Cargo.toml'
        - docs/about.toml
        - mise.dev.toml
        - docs/third-party-licenses.hbs
        - docs/generator-third-party-licenses.hbs
        - installer/release/generate_license_report.py
        - THIRD-PARTY-LICENSES.html
        - GENERATOR-THIRD-PARTY-LICENSES.html

commit-msg:
  jobs:
    - name: check-message
      # Quoted: git passes an absolute path, which may contain spaces.
      run: make check-commit-message COMMIT_MSG_FILE="{1}"

# Tests stay out of pre-commit: they are the slowest gate and nothing they
# catch is worth blocking a local checkpoint commit over. lefthook skips these
# jobs when there is nothing new to push, which reads as "no matching push
# files" in its output.
pre-push:
  jobs:
    - name: test
      run: make test
    - name: test-rust
      run: make test-rust
