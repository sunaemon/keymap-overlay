[project]
name = "keymap-overlay"
version = "0.0.5"
description = "Generates QMK keymap layer images for the keymap-overlay app"

readme = "README.md"
license = { file = "LICENSE.md" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0.0",
  "typer>=0.12.0",
  "hjson>=3.1.0",
  "jsonschema>=4.25.1",
]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.pytest.ini_options]
testpaths = ["model/tests", "installer/tests", "firmware/tests", "tools/tests"]
norecursedirs = ["firmware/vendor/qmk", ".venv"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["model"]
exclude = ["model/tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["firmware/vendor/qmk/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["firmware", "installer", "model", "tools"]

[tool.ty.src]
exclude = ["firmware/vendor/qmk"]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"
