[package]
name = "keymap-overlay"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
keymap-core = { path = "../keymap-core" }
log = "0.4.33"
env_logger = "0.11.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The window is the one part that cannot be shared: macOS gets native AppKit,
# Linux publishes to separate GNOME/Qt renderers, and the Windows WPF process
# loads this crate through its own audited C ABI bridge.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch = "0.2.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "NSAppearance",
  "NSApplication",
  "NSBox",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSGlassEffectView",
  "NSGraphics",
  "NSFont",
  "NSFontDescriptor",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSText",
  "NSTextField",
  "NSView",
  "NSViewController",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSGeometry",
  "NSObjCRuntime",
  "NSRunLoop",
  "NSString",
  "NSThread",
] }
# macOS opens the same device from several processes; VIAL tools and the
# overlay share the keyboard's Raw HID interface.
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }
# Event-driven Raw HID arrival notifications. hidapi reports removals through
# reads, but does not expose IOHIDManager's device-matching callback.
iohidmanager = { version = "0.10.4", default-features = false, features = [
  "async",
] }
pollster = "1.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# The pure-Rust Windows backend rather than hidapi's bundled C one, so that
# building from an MSYS2 shell needs no C compiler and no path translation for
# it. Both report the usage page the Raw HID interface is selected by.
hidapi = { version = "2.6.6", default-features = false, features = [
  "windows-native",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keymap-overlay-linux-protocol = { path = "../keymap-overlay-linux-protocol" }
zbus.workspace = true
# Waking the listener when a keyboard arrives. hidapi exposes no hot-plug
# callback, and libudev is already linked for its hidraw enumeration, so this
# is a binding to a library the overlay loads either way.
udev = { version = "0.9", default-features = false }
# Blocking on the udev socket until it has something to say. The workspace
# forbids unsafe, which rules out calling poll(2) through libc, and polling's
# safe wrapper still needs an unsafe `add`.
rustix = { version = "1.1", features = ["event"] }
# hidraw, not the default libusb backend: libusb detaches the kernel driver,
# which would stop the keyboard from typing, and only hidraw reports the usage
# page the Raw HID interface is selected by.
hidapi = { version = "2.6.6", default-features = false, features = [
  "linux-static-hidraw",
] }

[dev-dependencies]
tempfile = "3.27.0"
