[package]
name = "keymap-overlay-qt-bridge"
version = "0.0.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/sunaemon/keymap-overlay"

# This is the one audited exception to the workspace's no-unsafe rule: cxx
# expands its C++ FFI declaration to unsafe Rust. Its public API remains safe,
# and all application state and protocol logic stay in forbid-unsafe crates.
[lints.rust]
unsafe_code = "allow"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0"
cxx = "1.0"

[[bin]]
name = "keymap-overlay-qt"
path = "src/main.rs"

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"
