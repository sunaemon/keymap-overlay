[package]
name = "keymap-overlay-hil"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }
keymap-core = { path = "../../overlay/keymap-core" }
keymap-overlay-generator = { path = "../../overlay/keymap-overlay-generator" }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hidapi = { version = "2.6.6", default-features = false, features = [
  "linux-static-hidraw",
] }
keymap-core = { path = "../../overlay/keymap-core" }
keymap-overlay-generator = { path = "../../overlay/keymap-overlay-generator" }
serde_json = "1.0"
