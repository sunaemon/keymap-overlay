[package]
name = "keymap-overlay-linux-daemon"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[[bin]]
name = "keymap-overlay"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0"
keymap-overlay-linux-protocol = { path = "../protocol" }
keymap-overlay-runtime = { path = "../../../keymap-overlay-runtime" }
log = "0.4.33"
rustix = { version = "1.1", features = ["event"] }
serde_json = "1.0"
signal-hook = "0.3"
udev = { version = "0.9", default-features = false }
zbus.workspace = true
