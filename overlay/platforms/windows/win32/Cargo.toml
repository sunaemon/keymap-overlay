[package]
name = "keymap-overlay-windows"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[[bin]]
name = "keymap-overlay"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1.0"
keymap-overlay-runtime = { path = "../../../keymap-overlay-runtime" }
log = "0.4.33"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
# The Win32 window procedure and its user-data ownership form one small,
# reviewed boundary in windows.rs; the rest of the production crate stays safe.
unsafe_code = "deny"
