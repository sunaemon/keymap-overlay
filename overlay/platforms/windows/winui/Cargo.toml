[package]
name = "keymap-overlay-winui"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

# This is an experimental pure-Rust WinUI 3 frontend. The WPF frontend remains
# the release implementation until this has passed the physical focus test.
[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1.0"
keymap-overlay-runtime = { path = "../../../keymap-overlay-runtime" }
log = "0.4.33"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = { git = "https://github.com/microsoft/windows-rs.git", rev = "1be5649497b59fe7cc2fb0ae5b0ebd7787327cc8" }
windows-reactor = { git = "https://github.com/microsoft/windows-rs.git", rev = "1be5649497b59fe7cc2fb0ae5b0ebd7787327cc8" }

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs.git", rev = "1be5649497b59fe7cc2fb0ae5b0ebd7787327cc8" }

[lints.clippy]
cognitive_complexity = "warn"

[lints.rust]
# WinUI exposes the HWND only through COM, and the non-activating overlay
# contract requires a small, reviewed Win32 subclass around that handle.
unsafe_code = "deny"
