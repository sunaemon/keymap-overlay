[package]
name = "keymap-overlay-macos"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[[bin]]
name = "keymap-overlay"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1.0"
block2 = "0.6.2"
dispatch = "0.2.0"
iohidmanager = { version = "0.10.4", default-features = false, features = [
  "async",
] }
keymap-overlay-runtime = { path = "../../../keymap-overlay-runtime" }
log = "0.4.33"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "NSAppearance",
  "NSApplication",
  "NSBox",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSGlassEffectView",
  "NSGraphics",
  "NSFont",
  "NSFontDescriptor",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSText",
  "NSTextField",
  "NSView",
  "NSViewController",
  "NSVisualEffectView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSGeometry",
  "NSObjCRuntime",
  "NSProcessInfo",
  "NSRunLoop",
  "NSString",
  "NSThread",
] }
pollster = "1.0.1"
