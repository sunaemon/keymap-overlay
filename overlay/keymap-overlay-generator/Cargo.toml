[package]
name = "keymap-overlay-generator"
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/sunaemon/keymap-overlay"

# This is a library of display-model generation code. The runtime links it
# directly so refresh happens inside the platform overlay process.
[lints.rust]
unsafe_code = "forbid"

[lib]
name = "keymap_overlay_generator"
path = "src/lib.rs"

# Development entry point for `make draw-layers`.
# Release builds link the library into the overlay and do not ship this binary.
[[bin]]
name = "keymap-overlay-generator"
path = "src/main_generator.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
keymap-core = { path = "../keymap-core" }
log = "0.4.33"
lzma-rust2 = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# The Vial reader and the overlay share the keyboard's Raw HID interface.
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = [
  "windows-native",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# hidraw, not the default libusb backend: libusb detaches the kernel driver,
# which would stop the keyboard from typing, and only hidraw reports the
# usage page the Raw HID interface is selected by.
hidapi = { version = "2.6.6", default-features = false, features = [
  "linux-static-hidraw",
] }

[dev-dependencies]
tempfile = "3.27.0"
