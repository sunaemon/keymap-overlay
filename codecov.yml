coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: 'header, diff, components, files'
  behavior: default
  require_changes: true

component_management:
  individual_components:
    - component_id: python
      name: Python
      paths:
        - model/**/*.py
        - installer/release/*.py
        - firmware/tools/*.py
        - tools/*.py
    - component_id: rust
      name: Rust
      paths:
        - overlay/**/*.rs
        - tools/keymap-overlay-hil/**/*.rs
