codecov:
  notify:
    # Linux uploads the shared Python/Rust report while macOS and Windows add
    # their platform-only Rust coverage. Do not evaluate an incomplete merge.
    after_n_builds: 3
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        # The cross-platform project baseline is still under observation; see
        # docs/coverage-policy.md for the rollout criteria.
        informational: true
    patch:
      default:
        # New or changed executable lines need 80% coverage. A one-point
        # allowance accounts for platform-specific compilation paths.
        target: 80%
        threshold: 1%
        informational: false
        if_ci_failed: error
        only_pulls: true

comment:
  layout: 'header, diff, components, files'
  behavior: default
  require_changes: true

component_management:
  individual_components:
    - component_id: python
      name: Python
      paths:
        - model/**/*.py
        - installer/release/*.py
        - firmware/tools/*.py
        - tools/*.py
    - component_id: rust
      name: Rust
      paths:
        - overlay/**/*.rs
        - tools/keymap-overlay-hil/**/*.rs
