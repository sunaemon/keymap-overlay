[workspace]
members = [
  "crates/keymap-core",
  "crates/keymap-overlay-linux-protocol",
  "crates/keymap-overlay",
  "crates/keymap-overlay-winui",
  "crates/keymap-overlay-windows-bridge",
]
resolver = "2"

[workspace.package]
version = "0.0.5"
license = "MIT"
repository = "https://github.com/sunaemon/keymap-overlay"

[workspace.dependencies]
zbus = "5.18.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "warn"
