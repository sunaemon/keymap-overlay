[workspace]
members = [
  "overlay/keymap-core",
  "overlay/keymap-overlay-runtime",
  "overlay/keymap-overlay-generator",
  "overlay/platforms/macos/appkit",
  "overlay/platforms/linux/daemon",
  "overlay/platforms/linux/protocol",
  "overlay/platforms/windows/bridge",
  "overlay/platforms/windows/winui",
]
resolver = "2"

[workspace.package]
version = "0.0.5"
license = "MIT"
repository = "https://github.com/sunaemon/keymap-overlay"

[workspace.dependencies]
zbus = "5.18.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "warn"
